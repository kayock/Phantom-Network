<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHANTOM NETWORK — LAN Command Center</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="Phantom Network — local LAN command center. Files, messaging, audio and monitoring for your private network. No cloud.">
<meta name="theme-color" content="#0a0c14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phantom">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div id="boot" class="boot-screen">
  <div class="boot-inner">
    <img src="/assets/logo.svg" alt="Phantom Network logo" class="boot-logo">
    <div class="boot-title">PHANTOM NETWORK</div>
    <div class="boot-sub">initializing command center…</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar"></div></div>
    <div class="boot-err" id="boot-err"></div>
  </div>
</div>

<div id="app" class="app hidden" aria-label="Phantom Network command center">
  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/assets/logo.svg" alt="" class="brand-logo">
      <div class="brand-text">
        <div class="brand-name">PHANTOM</div>
        <div class="brand-sub">NETWORK v1.4.0</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-view="dashboard"><span class="nav-ico">◈</span><span class="nav-label">Command Center</span></a>
      <a class="nav-item" data-view="radar"><span class="nav-ico">◉</span><span class="nav-label">Network Radar</span></a>
      <a class="nav-item" data-view="commander"><span class="nav-ico">▤</span><span class="nav-label">File Commander</span></a>
      <a class="nav-item" data-view="transfers"><span class="nav-ico">⇄</span><span class="nav-label">Transfer Center</span></a>
      <a class="nav-item" data-view="chat"><span class="nav-ico">◌</span><span class="nav-label">GhostChat</span><span class="nav-badge" id="chat-badge" hidden></span></a>
      <a class="nav-item" data-view="audio"><span class="nav-ico">♪</span><span class="nav-label">Audio Command</span></a>
      <a class="nav-item" data-view="intercom"><span class="nav-ico">◐</span><span class="nav-label">Intercom</span></a>
      <a class="nav-item" data-view="voice"><span class="nav-ico">☎</span><span class="nav-label">Voice</span></a>
      <a class="nav-item" data-view="broadcast"><span class="nav-ico">📣</span><span class="nav-label">Broadcast</span></a>
      <a class="nav-item" data-view="media"><span class="nav-ico">♪</span><span class="nav-label">Media</span></a>
      <a class="nav-item" data-view="clipboard"><span class="nav-ico">⧉</span><span class="nav-label">Clipboard</span></a>
      <a class="nav-item" data-view="mesh"><span class="nav-ico">⌗</span><span class="nav-label">Mesh</span></a>
      <a class="nav-item" data-view="signal"><span class="nav-ico">∿</span><span class="nav-label">Signal Lab</span></a>
      <a class="nav-item" data-view="fleet"><span class="nav-ico">▦</span><span class="nav-label">Fleet Monitor</span></a>
      <a class="nav-item" data-view="events"><span class="nav-ico">≡</span><span class="nav-label">Events</span></a>
      <a class="nav-item" data-view="settings"><span class="nav-ico">⚙</span><span class="nav-label">Settings</span></a>
      <a class="nav-item" data-view="diagnostics"><span class="nav-ico">✚</span><span class="nav-label">Diagnostics</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="self-chip" id="self-chip" title="This device"></div>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <!-- ======================= MAIN ======================= -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle menu">☰</button>
      <div class="topbar-title" id="view-title">Command Center</div>
      <div class="topbar-status" id="topbar-status">
        <span class="status-pill" id="status-peers" title="Participating devices online">—</span>
        <span class="status-pill" id="status-stream" title="Live event stream">●</span>
        <span class="status-pill" id="status-clock"></span>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- command palette -->
<div class="modal-layer hidden" id="palette-layer"><div class="palette-card" id="palette-card"></div></div>

<!-- modal + toast layers -->
<div class="modal-layer hidden" id="modal-layer"><div class="modal-card" id="modal-card"></div></div>
<div class="toast-layer" id="toast-layer"></div>
<div class="ctx-layer hidden" id="ctx-layer"></div>

<script>
/* Phones and tablets get the dedicated mobile interface (/m).
   Desktop users can force either side; choice persists. */
(function () {
  try {
    var override = localStorage.getItem('pn_ui_override');   // 'mobile'|'desktop'
    var narrow = Math.min(screen.width, window.innerWidth) < 700
      || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var touch = 'ontouchstart' in window && narrow;
    if (narrow && touch && override !== 'desktop'
        && location.pathname.indexOf('/m') !== 0) {
      location.replace('/m' + (location.hash || ''));
    }
  } catch (e) { /* never block the desktop UI on storage errors */ }
})();
</script>
<script src="/js/app.js" type="module"></script>
</body>
</html>
