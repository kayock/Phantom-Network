name: build-windows

# Builds the Windows companion executable on a real Windows runner.
# STATUS: delivered with v1.3.0; NOT yet executed (no Windows runner in the
# development environment). First successful run must be verified before
# publishing artifacts to users (see BUILD_LOG.txt / TEST_REPORT.md).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.* psutil

      - name: Run backend test suite (fast subset)
        run: |
          python -m pytest tests/unit -q

      - name: Build executable from the existing spec
        run: |
          pyinstaller packaging/companion.spec --noconfirm

      - name: Smoke-test the exe (version + help)
        run: |
          & dist\companion\companion.exe --version
          & dist\companion\companion.exe --help | Select-Object -First 5

      - name: Stage portable distribution
        run: |
          New-Item -ItemType Directory -Force -Path stage\Phantom-Network-windows | Out-Null
          Copy-Item -Recurse -Force dist\companion\* stage\Phantom-Network-windows\
          Copy-Item -Recurse -Force web stage\Phantom-Network-windows\web
          Copy-Item -Recurse -Force sounds stage\Phantom-Network-windows\sounds
          Copy-Item packaging\run-phantom-windows.bat stage\Phantom-Network-windows\
          Copy-Item README.md,LICENSE stage\Phantom-Network-windows\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-network-windows-${{ github.ref_name }}
          path: stage\Phantom-Network-windows\
